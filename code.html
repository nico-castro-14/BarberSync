          time: selectedTime,
          client: clientForm.name,
          phone: clientForm.phone,
          service: selectedService.name,
          price: selectedService.price,

                <div className="bg-brand-card border border-brand-border rounded-3xl p-6 sm:p-8 space-y-5">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                      <h2 className="text-lg font-bold text-white flex items-center gap-2">
                        <i data-lucide="users" className="w-5 h-5 text-brand-gold"></i>
                        Equipo de Barberos & Productividad
                      </h2>
                      <p className="text-xs text-brand-muted">Comisiones calculadas al 50/50 y satisfacción del cliente</p>
                    </div>
                  </div>

                  <div className="divide-y divide-brand-border">
                    {BARBERS_DATA.map((barber, index) => (
                      <div key={barber.id} className="py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                          <div className={`w-11 h-11 rounded-2xl bg-gradient-to-tr ${barber.color} flex items-center justify-center font-black text-white text-sm shadow-md`}>
                            {barber.initials}
                          </div>
                          <div>
                            <div className="flex items-center gap-2">
                              <h3 className="font-bold text-sm text-white">{barber.name}</h3>
                              <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-white/5 border border-white/10 text-slate-300">
                                {barber.chair}
                              </span>
                            </div>
                            <p className="text-xs text-brand-muted">{barber.role}</p>
                          </div>
                        </div>

                        <div className="flex flex-wrap items-center gap-6 text-xs text-slate-300">
                          <div>
                            <span className="text-slate-500 block text-[10px] uppercase">RATING</span>
                            <span className="font-bold text-amber-400 flex items-center gap-1">
                              <i data-lucide="star" className="w-3 h-3 fill-amber-400"></i> {barber.rating}
                            </span>
                          </div>
                          <div>
                            <span className="text-slate-500 block text-[10px] uppercase">PRODUCIDO HOY</span>
                            <span className="font-black text-white">${barber.earningsToday.toLocaleString('es-CL')}</span>
                          </div>
                          <div>
                            <span className="text-slate-500 block text-[10px] uppercase">ESTA SEMANA</span>
                            <span className="font-black text-brand-gold">${barber.earningsWeek.toLocaleString('es-CL')}</span>
                          </div>
                          <div>
                            <span className="text-slate-500 block text-[10px] uppercase">ESTADO</span>
                            <span className="text-emerald-400 font-bold flex items-center gap-1">
                              <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Activo
                            </span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* SECCIÓN CONFIGURACIÓN DEL LOCAL */}
                <div className="bg-brand-card border border-brand-border rounded-3xl p-6 sm:p-8 space-y-6">
                  <div className="flex items-center justify-between border-b border-brand-border pb-4">
                    <div>
                      <h2 className="text-lg font-bold text-white flex items-center gap-2">
                        <i data-lucide="settings" className="w-5 h-5 text-brand-gold"></i>
                        Configuración de la Barbería
                      </h2>
                      <p className="text-xs text-brand-muted">Horarios, dirección física para Google Maps y políticas de cancelación</p>
                    </div>
                    <button
                      onClick={() => triggerToast('Configuración de la sede guardada correctamente')}
                      className="bg-brand-gold hover:bg-brand-goldHover text-black font-extrabold text-xs px-4 py-2 rounded-xl shadow-md"
                    >
                      Guardar Cambios
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-xs">
                    <div className="space-y-2">
                      <label className="font-bold text-slate-300 uppercase tracking-wider block">Nombre de la Sede</label>
                      <input
                        type="text"
                        value={businessInfo.name}
                        onChange={(e) => setBusinessInfo({ ...businessInfo, name: e.target.value })}
                        className="w-full bg-[#0A0C10] border border-brand-border rounded-xl px-4 py-3 text-white text-xs focus:border-brand-gold focus:outline-none"
                      />
                    </div>

                    <div className="space-y-2">
                      <label className="font-bold text-slate-300 uppercase tracking-wider block">Dirección para Google Maps</label>
                      <input
                        type="text"
                        value={businessInfo.address}
                        onChange={(e) => setBusinessInfo({ ...businessInfo, address: e.target.value })}
                        className="w-full bg-[#0A0C10] border border-brand-border rounded-xl px-4 py-3 text-white text-xs focus:border-brand-gold focus:outline-none"
                      />
                    </div>

                    <div className="space-y-2">
                      <label className="font-bold text-slate-300 uppercase tracking-wider block">Horario de Apertura y Cierre</label>
                      <input
                        type="text"
                        value={businessInfo.openingHours}
                        onChange={(e) => setBusinessInfo({ ...businessInfo, openingHours: e.target.value })}
                        className="w-full bg-[#0A0C10] border border-brand-border rounded-xl px-4 py-3 text-white text-xs focus:border-brand-gold focus:outline-none"
                      />
                    </div>

                    <div className="space-y-2">
                      <label className="font-bold text-slate-300 uppercase tracking-wider block">Política de Cancelación</label>
                      <input
                        type="text"
                        value={businessInfo.cancellationPolicy}
                        onChange={(e) => setBusinessInfo({ ...businessInfo, cancellationPolicy: e.target.value })}
                        className="w-full bg-[#0A0C10] border border-brand-border rounded-xl px-4 py-3 text-white text-xs focus:border-brand-gold focus:outline-none"
                      />
                    </div>
                  </div>
                </div>

              </div>
            )}

            {/* ========================================================================= */}
            {/* MODAL SIMULADOR INTERACTIVO DE WHATSAPP (CONFIRMACIÓN & RECORDATORIO) */}
            {/* ========================================================================= */}
            {showWhatsAppModal && confirmedBookingData && (
              <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
                <div className="bg-[#111B21] border border-emerald-500/40 rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl animate-scale-up">
                  
                  {/* WhatsApp Header Verde */}
                  <div className="bg-[#202C33] px-5 py-4 flex items-center justify-between border-b border-white/5">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center text-white font-black">
                        <i data-lucide="scissors" className="w-5 h-5"></i>
                      </div>
                      <div>
                        <div className="flex items-center gap-1.5">
                          <h3 className="font-bold text-sm text-white">BarberSync Providencia</h3>
                          <i data-lucide="badge-check" className="w-4 h-4 fill-emerald-500 text-black"></i>
                        </div>
                        <p className="text-[11px] text-emerald-400 flex items-center gap-1">
                          <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Cuenta Oficial • En línea
                        </p>
                      </div>
                    </div>
                    <button
                      onClick={() => setShowWhatsAppModal(false)}
                      className="text-slate-400 hover:text-white p-1 rounded-lg"
                    >
                      <i data-lucide="x" className="w-5 h-5"></i>
                    </button>
                  </div>

                  {/* WhatsApp Chat Body */}
                  <div className="p-5 space-y-4 whatsapp-bg text-xs">
                    
                    {/* Mensaje de Confirmación Automatizado */}
                    <div className="bg-[#202C33] border border-white/5 rounded-2xl rounded-tl-none p-4 text-slate-200 space-y-3 shadow-md max-w-[95%]">
                      <p className="leading-relaxed">
                        ¡Hola <strong className="text-white">{confirmedBookingData.client}</strong>! ✂️ Tu cita para <strong className="text-amber-400">{confirmedBookingData.service}</strong> con <strong className="text-white">{confirmedBookingData.barberName}</strong> está <strong className="text-emerald-400 font-black">CONFIRMADA</strong>.
                      </p>

                      <div className="bg-[#111B21]/90 rounded-xl p-3 space-y-1.5 border border-white/5">
                        <div className="flex justify-between">
                          <span className="text-slate-400">Fecha:</span>
                          <span className="font-bold text-white">{confirmedBookingData.dateStr}</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-400">Hora:</span>
                          <span className="font-bold text-brand-gold">{confirmedBookingData.time}</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-400">Estación:</span>
                          <span className="font-bold text-white">{confirmedBookingData.chair}</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-400">Total en local:</span>
                          <span className="font-bold text-emerald-400">{confirmedBookingData.price}</span>
                        </div>
                      </div>

                      {/* Botones Interactivos de WhatsApp */}
                      <div className="pt-2 space-y-2">
                        <button
                          onClick={() => {
                            setWhatsappActionToast('Solicitud de reprogramación abierta. Elige nueva fecha en el calendario.');
                            setShowWhatsAppModal(false);
                          }}
                          className="w-full bg-[#111B21] hover:bg-[#2A3942] text-amber-400 font-bold py-2.5 px-3 rounded-xl border border-white/10 text-center flex items-center justify-center gap-2 transition-colors"
                        >
                          <i data-lucide="calendar" className="w-3.5 h-3.5"></i>
                          <span>Reprogramar Cita</span>
                        </button>

                        <button
                          onClick={() => {
                            setAppointments(prev => prev.filter(a => a.id !== confirmedBookingData.id));
                            setWhatsappActionToast('Cita cancelada con éxito sin cargos.');
                            setShowWhatsAppModal(false);
                          }}
                          className="w-full bg-[#111B21] hover:bg-rose-950/40 text-rose-400 font-semibold py-2 px-3 rounded-xl border border-white/10 text-center flex items-center justify-center gap-2 transition-colors"
                        >
                          <i data-lucide="x-circle" className="w-3.5 h-3.5"></i>
                          <span>Cancelar Cita</span>
                        </button>

                        <a
                          href="https://maps.google.com"
                          target="_blank"
                          rel="noreferrer"
                          className="block w-full bg-[#111B21] hover:bg-[#2A3942] text-slate-300 font-medium py-2 px-3 rounded-xl border border-white/10 text-center flex items-center justify-center gap-2 transition-colors"
                        >
                          <i data-lucide="map-pin" className="w-3.5 h-3.5 text-red-400"></i>
                          <span>Ver en Google Maps (Av. Providencia 2133)</span>
                        </a>
                      </div>

                      <div className="text-[10px] text-right text-slate-400 flex items-center justify-end gap-1 pt-1">
                        <span>12:00</span>
                        <i data-lucide="check-check" className="w-3.5 h-3.5 text-sky-400"></i>
                      </div>
                    </div>

                    {/* Simulación del Sistema de Calificación Post-Servicio */}
                    <div className="bg-[#182229] border border-amber-500/20 rounded-2xl p-3.5 space-y-2 text-slate-300">
                      <div className="flex items-center gap-1.5 text-amber-400 font-bold">
                        <i data-lucide="sparkles" className="w-3.5 h-3.5"></i>
                        <span>Calificación Automática 15 min Post-Servicio</span>
                      </div>
                      <p className="text-[11px] leading-relaxed text-slate-400">
                        Una vez finalizado tu corte, recibirás un mensaje para calificar con 1 a 5 estrellas a tu barbero y dejar tu reseña verificada.
                      </p>
                      <div className="flex justify-center gap-2 py-1 text-amber-400">
                        <i data-lucide="star" className="w-4 h-4 fill-amber-400"></i>
                        <i data-lucide="star" className="w-4 h-4 fill-amber-400"></i>
                        <i data-lucide="star" className="w-4 h-4 fill-amber-400"></i>
                        <i data-lucide="star" className="w-4 h-4 fill-amber-400"></i>
                        <i data-lucide="star" className="w-4 h-4 fill-amber-400"></i>
                      </div>
                    </div>

                  </div>

                  {/* Modal Footer */}
                  <div className="bg-[#202C33] p-4 flex gap-3">
                    <button
                      onClick={() => setShowWhatsAppModal(false)}
                      className="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-extrabold py-3 rounded-xl transition-all text-xs"
                    >
                      Entendido, cerrar ventana
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* ========================================================================= */}
            {/* MODAL SUBIR NUEVO CORTE (GESTIÓN DE PORTAFOLIO BARBERO) */}
            {/* ========================================================================= */}
            {showUploadCutModal && (
              <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                <div className="bg-brand-card border border-brand-border rounded-3xl p-6 sm:p-8 max-w-md w-full space-y-5 shadow-2xl animate-scale-up">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <div className="w-8 h-8 rounded-xl bg-brand-gold/15 text-brand-gold flex items-center justify-center">
                        <i data-lucide="upload" className="w-4 h-4"></i>
                      </div>
                      <h3 className="text-lg font-black text-white">Publicar en Portafolio</h3>
                    </div>
                    <button
                      onClick={() => setShowUploadCutModal(false)}
                      className="text-slate-400 hover:text-white"
                    >
                      <i data-lucide="x" className="w-5 h-5"></i>
                    </button>
                  </div>

                  <form onSubmit={handlePublishCut} className="space-y-4">
                    {/* Zona Drag & Drop Simulada */}
                    <div className="border-2 border-dashed border-brand-border hover:border-brand-gold/50 rounded-2xl p-6 text-center space-y-2 bg-[#0A0C10] cursor-pointer transition-colors">
                      <i data-lucide="image-plus" className="w-8 h-8 mx-auto text-brand-gold"></i>
                      <p className="text-xs font-bold text-white">Arrastra la foto del corte o haz clic para explorar</p>
                      <p className="text-[11px] text-slate-500">Formato JPG, PNG optimizado para Instagram Grid</p>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1.5 uppercase tracking-wider">
                        Nombre del Estilo / Corte <span className="text-brand-gold">*</span>
                      </label>
                      <input
                        type="text"
                        required
                        value={newCutTitle}
                        onChange={(e) => setNewCutTitle(e.target.value)}
                        placeholder="Ej: Skin Fade con Texturizado Nuca"
                        className="w-full bg-[#0A0C10] border border-brand-border rounded-xl px-4 py-3 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-brand-gold"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1.5 uppercase tracking-wider">
                        Categoría / Tag Principal <span className="text-brand-gold">*</span>
                      </label>
                      <select
                        value={newCutTag}
                        onChange={(e) => setNewCutTag(e.target.value)}
                        className="w-full bg-[#0A0C10] border border-brand-border rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-brand-gold"
                      >
                        <option value="Fade">#Fade (Degradado)</option>
                        <option value="Mullet">#Mullet (Moderno)</option>
                        <option value="Barba">#Barba (Ritual / Perfilado)</option>
                        <option value="Tinte">#Tinte (Platinado / Color)</option>
                        <option value="Texturizado">#Texturizado (Crop / Tijera)</option>
                        <option value="Clásico">#Clásico (Old School)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1.5 uppercase tracking-wider">
                        Técnica o Cera Utilizada (Opcional)
                      </label>
                      <textarea
                        rows={2}
                        value={newCutDesc}
                        onChange={(e) => setNewCutDesc(e.target.value)}
                        placeholder="Ej: Tijera de entresacar en nuca, pomada mate al agua."
                        className="w-full bg-[#0A0C10] border border-brand-border rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-brand-gold resize-none"
                      />
                    </div>

                    <div className="flex gap-3 pt-2">
                      <button
                        type="button"
                        onClick={() => setShowUploadCutModal(false)}
                        className="flex-1 bg-white/5 hover:bg-white/10 text-white font-medium py-3 rounded-xl border border-brand-border text-xs"
                      >
                        Cancelar
                      </button>
                      <button
                        type="submit"
                        className="flex-1 bg-brand-gold hover:bg-brand-goldHover text-black font-black py-3 rounded-xl text-xs shadow-md"
                      >
                        Publicar en Portafolio
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Notification Toast for WhatsApp action */}
            {whatsappActionToast && (
              <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 bg-[#141B26] border border-brand-gold text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-xs font-bold">
                <i data-lucide="check" className="w-4 h-4 text-brand-gold"></i>
                <span>{whatsappActionToast}</span>
                <button onClick={() => setWhatsappActionToast(null)} className="ml-2 text-slate-400 hover:text-white">
                  ✕
                </button>
              </div>
            )}

          </main>

          {/* Footer Minimalista */}
          <footer className="border-t border-brand-border bg-[#0A0C10] mt-16 py-8 text-center text-xs text-brand-muted">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="font-extrabold text-white">Barber<span className="text-brand-gold">Sync</span> PRO</span>
                <span>— Sistema Integral de Barbería, Portafolio & WhatsApp Automation</span>
              </div>
              <div className="flex items-center gap-4 text-slate-500 text-[11px]">
                <span>Dark Mode Premium</span>
                <span>•</span>
                <span>Deep Links para Redes Sociales</span>
                <span>•</span>
                <span className="text-brand-gold">Lucide Icons SVG</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body></html>
